server:
  port: ${PORT:8080}

spring:
  application:
    name: keystone
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DATABASE_USERNAME:keystone}
    password: ${DATABASE_PASSWORD:keystone}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
